# 狂欢斗地主 服务端配置示例
#
# 生产环境不要用这份文件：请通过环境变量（CL_*）注入，尤其是 jwt.secret 与数据库口令。
# 这里保留完整字段是为了让本地开发 `go run ./cmd/api` 零配置即可启动。

app:
  name: carnival-landlords-server
  env: dev
  debug: true

http:
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  shutdown_timeout: 10s
  # 留空表示不信任任何反向代理头（生产建议显式写网关地址）
  trusted_proxies: []
  cors_origins:
    - "*"
  rate_limit_per_minute: 600

postgres:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  database: carnival_landlords
  ssl_mode: disable
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 1h
  auto_migrate: true

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 20
  key_prefix: cl

jwt:
  secret: carnival-landlords-dev-secret-change-me
  issuer: carnival-landlords
  access_ttl: 24h
  refresh_ttl: 720h
  access_audience: cl-client
  refresh_audience: cl-refresh
  max_active_sessions: 3

mail:
  # log = 只把验证码写日志（本地开发）；smtp = 真实投递
  driver: log
  host: ""
  port: 587
  user: ""
  pass: ""
  from: no-reply@carnival-landlords.local
  from_name: 狂欢斗地主
  code_ttl: 10m
  code_length: 6
  send_interval: 1m
  daily_limit: 20
  subject: "【狂欢斗地主】登录验证码 %s"

game:
  # 新账号初始虚拟币，与客户端 PlayerProfile.START_GOLD / START_DIAMONDS 对齐
  initial_gold: 2000
  initial_diamonds: 30
  match_interval: 1s
  match_timeout: 12s
  match_score_range: 800
  room_idle_timeout: 10m
  turn_timeout: 20s
  bid_timeout: 15s
  reconnect_grace: 2m
  bot_enabled: true
  bot_delay: 1200ms
  max_rooms: 0

log:
  level: info
  format: console
